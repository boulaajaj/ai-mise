name: CI

# Mini CI (issues #27/#28): the repo's own validators run on every change —
# the self-hosting ladder's "workspace checks run without a human remembering"
# rung, applied to this repo first. Strict: failures block (make this a
# required status check on main once green).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install validation libraries
        run: pip install pyyaml jsonschema

      - name: Policy validates against schema
        run: >
          python control-plane/validation/validate_policy.py
          --policy control-plane/constitution/policy.yaml
          --schema control-plane/constitution/policy.schema.json

      - name: Approval schema examples validate
        run: |
          python - <<'PYEOF'
          import json, pathlib, jsonschema
          root = pathlib.Path('control-plane/approval')
          ps = json.loads((root/'proposal.schema.json').read_text())
          rs = json.loads((root/'receipt.schema.json').read_text())
          fails = 0
          files = sorted((root/'examples').glob('*.json'))
          if not files:
              print('FAIL: no example files found'); raise SystemExit(1)
          for f in files:
              if f.name.startswith('prop-'):
                  schema = ps
              elif f.name.startswith('rcpt-'):
                  schema = rs
              else:
                  print(f.name, 'FAIL: unknown example prefix (expected prop-* or rcpt-*)')
                  fails += 1
                  continue
              doc = json.loads(f.read_text())
              errs = list(jsonschema.Draft202012Validator(schema).iter_errors(doc))
              print(f.name, 'PASS' if not errs else 'FAIL: ' + errs[0].message)
              fails += bool(errs)
          raise SystemExit(1 if fails else 0)
          PYEOF

      - name: Protected-path validator self-test (every failure mode must fire)
        run: |
          cat > /tmp/bad-proposal.json <<'JSONEOF'
          {"proposal_id":"prop-20260101-selfok","created_at":"2026-01-01T00:00:00Z",
           "purpose":{"plain_language":"Self-test: this proposal must be rejected.","trigger":"ci"},
           "risk_category":"routine",
           "changes":[
             {"path":"sources/evidence.md","action":"modify","before_hash":"aa","after_hash":"bb"},
             {"path":"../escape.md","action":"create","before_hash":null,"after_hash":"cc"},
             {"path":"generated/claude-code/CLAUDE.md","action":"modify","before_hash":"dd","after_hash":"ee"}],
           "validations":[],"rollback_id":"r","expires_at":"2026-01-02T00:00:00Z"}
          JSONEOF
          mkdir -p /tmp/ws
          set +e
          out=$(python control-plane/validation/protected_path_validator.py \
                  --workspace /tmp/ws \
                  --policy control-plane/constitution/policy.yaml \
                  --proposal /tmp/bad-proposal.json)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then
            echo "SELF-TEST FAILED: expected exit code 1 (violations), got $rc"
            exit 1
          fi
          # Each distinct failure mode in the bad proposal must be individually reported:
          for needle in "protected path" "escapes workspace root" "tier mismatch"; do
            if ! echo "$out" | grep -q "$needle"; then
              echo "SELF-TEST FAILED: failure mode not reported: $needle"
              exit 1
            fi
          done
          echo "self-test OK: all three failure modes fired individually"

      - name: CLAUDE.md within size limit
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md: $lines lines (limit 200)"
          [ "$lines" -le 200 ]

      - name: Skill frontmatter parses, and stays within the recorded limits
        run: |
          python - <<'PYEOF'
          import pathlib, re, sys, yaml
          # A skill whose frontmatter does not parse is a skill that may simply
          # not load, with no error anyone sees. Claude Code tolerated an
          # unquoted description containing ": " for months; a stricter host
          # would not have, and nothing here would have said so.
          policy = yaml.safe_load(pathlib.Path(
              'control-plane/constitution/policy.yaml').read_text())
          max_lines = policy['placement']['limits']['skill_md_max_lines']
          fails = []
          skills = sorted(pathlib.Path('skills').glob('*/SKILL.md'))
          if not skills:
              print('FAIL: no skills found'); raise SystemExit(1)
          for path in skills:
              text = path.read_text(encoding='utf-8')
              match = re.match(r'^---\s*\n(.*?)\n---\s*\n', text, re.DOTALL)
              if not match:
                  fails.append(f'{path}: no YAML frontmatter'); continue
              try:
                  front = yaml.safe_load(match.group(1))
              except yaml.YAMLError as exc:
                  first = str(exc).splitlines()[0]
                  fails.append(f'{path}: frontmatter is not valid YAML: {first}')
                  continue
              if not isinstance(front, dict):
                  fails.append(f'{path}: frontmatter is not a mapping'); continue
              for key in ('name', 'description'):
                  if not front.get(key):
                      fails.append(f'{path}: frontmatter has no {key}')
              if front.get('name') and front['name'] != path.parent.name:
                  fails.append(f'{path}: name {front["name"]!r} != folder '
                               f'{path.parent.name!r} — the folder is the trigger')
              n = len(text.splitlines())
              if n > max_lines:
                  fails.append(f'{path}: {n} lines exceeds limit {max_lines}')
              else:
                  print(f'{path}: OK ({n} lines, limit {max_lines})')
          for f in fails:
              print('FAIL:', f)
          raise SystemExit(1 if fails else 0)
          PYEOF
      - name: Inventory manifest is reproducible and path-clean (self-test)
        run: |
          set -e
          rm -rf /tmp/inv
          mkdir -p /tmp/inv/src/sub
          printf 'alpha' > /tmp/inv/src/a.txt
          printf 'beta' > /tmp/inv/src/sub/b.txt
          ln -s a.txt /tmp/inv/src/link.txt
          mkdir -p /tmp/inv/outside
          printf 'secret' > /tmp/inv/outside/secret.txt
          ln -s ../outside /tmp/inv/src/escape
          inv=skills/ai-mise/scripts/inventory.py
          python "$inv" --sources /tmp/inv/src --out /tmp/inv/m1.json
          python "$inv" --sources /tmp/inv/src --out /tmp/inv/m2.json
          python - <<'PYEOF'
          import json, pathlib, re
          m1 = json.loads(pathlib.Path('/tmp/inv/m1.json').read_text())
          m2 = json.loads(pathlib.Path('/tmp/inv/m2.json').read_text())
          fails = []
          if m1['content_digest'] != m2['content_digest']:
              fails.append('content_digest differs over an unchanged tree')
          a, b = dict(m1), dict(m2)
          a.pop('run'); b.pop('run')
          if a != b:
              fails.append('manifests differ outside the run block')
          if '/tmp/inv' in json.dumps(m1):
              fails.append('manifest records an absolute source path')
          if not any(s['path'] == 'link.txt' and s['reason'] == 'symlink'
                     for s in m1['skipped']):
              fails.append('symlink was not skipped')
          if 'secret' in json.dumps(m1):
              fails.append('read through a symlinked parent directory')
          if not any(s['path'] == 'escape' and s['reason'] == 'symlink'
                     for s in m1['skipped']):
              fails.append('symlinked directory was not recorded as skipped')
          if m1['file_count'] != 2:
              fails.append('expected 2 files, got %s' % m1['file_count'])
          stable = re.compile(r'^(symlink|not a regular file when opened'
                              r'|changed while being read|unreadable'
                              r'|outside the source folder'
                              r'|[A-Z][A-Z0-9]+)$')
          for s in m1['skipped']:
              if not stable.match(s['reason']):
                  fails.append('skip reason is not a stable token: '
                               + repr(s['reason']))
          for f in fails:
              print('FAIL:', f)
          if not fails:
              print('self-test OK: reproducible, path-clean, symlink-refusing')
          raise SystemExit(1 if fails else 0)
          PYEOF
