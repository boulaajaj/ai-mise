name: CI

# Mini CI (issues #27/#28): the repo's own validators run on every change —
# the self-hosting ladder's "workspace checks run without a human remembering"
# rung, applied to this repo first. Strict: failures block (make this a
# required status check on main once green).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install validation libraries
        run: pip install pyyaml jsonschema

      - name: Policy validates against schema
        run: >
          python control-plane/validation/validate_policy.py
          --policy control-plane/constitution/policy.yaml
          --schema control-plane/constitution/policy.schema.json

      - name: Approval schema examples validate
        run: |
          python - <<'PYEOF'
          import json, pathlib, jsonschema
          root = pathlib.Path('control-plane/approval')
          ps = json.loads((root/'proposal.schema.json').read_text())
          rs = json.loads((root/'receipt.schema.json').read_text())
          fails = 0
          files = sorted((root/'examples').glob('*.json'))
          if not files:
              print('FAIL: no example files found'); raise SystemExit(1)
          for f in files:
              if f.name.startswith('prop-'):
                  schema = ps
              elif f.name.startswith('rcpt-'):
                  schema = rs
              else:
                  print(f.name, 'FAIL: unknown example prefix (expected prop-* or rcpt-*)')
                  fails += 1
                  continue
              doc = json.loads(f.read_text())
              errs = list(jsonschema.Draft202012Validator(schema).iter_errors(doc))
              print(f.name, 'PASS' if not errs else 'FAIL: ' + errs[0].message)
              fails += bool(errs)
          raise SystemExit(1 if fails else 0)
          PYEOF

      - name: Protected-path validator self-test (every failure mode must fire)
        run: |
          cat > /tmp/bad-proposal.json <<'JSONEOF'
          {"proposal_id":"prop-20260101-selfok","created_at":"2026-01-01T00:00:00Z",
           "purpose":{"plain_language":"Self-test: this proposal must be rejected.","trigger":"ci"},
           "risk_category":"routine",
           "changes":[
             {"path":"sources/evidence.md","action":"modify","before_hash":"aa","after_hash":"bb"},
             {"path":"../escape.md","action":"create","before_hash":null,"after_hash":"cc"},
             {"path":"generated/claude-code/CLAUDE.md","action":"modify","before_hash":"dd","after_hash":"ee"}],
           "validations":[],"rollback_id":"r","expires_at":"2026-01-02T00:00:00Z"}
          JSONEOF
          mkdir -p /tmp/ws
          set +e
          out=$(python control-plane/validation/protected_path_validator.py \
                  --workspace /tmp/ws \
                  --policy control-plane/constitution/policy.yaml \
                  --proposal /tmp/bad-proposal.json)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then
            echo "SELF-TEST FAILED: expected exit code 1 (violations), got $rc"
            exit 1
          fi
          # Each distinct failure mode in the bad proposal must be individually reported:
          for needle in "protected path" "escapes workspace root" "tier mismatch"; do
            if ! echo "$out" | grep -q "$needle"; then
              echo "SELF-TEST FAILED: failure mode not reported: $needle"
              exit 1
            fi
          done
          echo "self-test OK: all three failure modes fired individually"

      - name: CLAUDE.md within size limit
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md: $lines lines (limit 200)"
          [ "$lines" -le 200 ]

      - name: Documented trigger matches the registered command (self-test)
        run: |
          set -e
          # The docs this repo actually ships must name a command that exists.
          python tools/check_documented_trigger.py

          # And every failure mode must fire on its own, so a green result
          # means the check looked rather than that it never objects.
          rm -rf /tmp/trig
          mkdir -p /tmp/trig/.claude-plugin /tmp/trig/skills/demo
          printf '{"name":"demo","plugins":[{"name":"demo","source":"./"}]}\n' \
            > /tmp/trig/.claude-plugin/marketplace.json
          printf -- '---\nname: demo\ndescription: d\n---\n\nbody\n' \
            > /tmp/trig/skills/demo/SKILL.md
          printf 'Run `claude plugin install demo@demo` then type `/demo`.\n' \
            > /tmp/trig/BARE.md
          printf 'Run `claude plugin install demo@demo` and you are done.\n' \
            > /tmp/trig/MISSING.md
          printf 'Run `claude plugin install demo@demo` then type `/demo:demo`.\n' \
            > /tmp/trig/OK.md
          # The signed-off escape hatch, and the two ways of abusing it.
          printf 'Type `/demo:demo`.\n<!-- trigger-ok-start: a real reason -->\n`/demo`\n<!-- trigger-ok-end -->\n' \
            > /tmp/trig/ALLOWED.md
          printf 'Type `/demo:demo`.\n<!-- trigger-ok-start: -->\n`/demo`\n<!-- trigger-ok-end -->\n' \
            > /tmp/trig/NOREASON.md
          printf 'Type `/demo:demo`.\n<!-- trigger-ok-start: oops -->\n`/demo`\n' \
            > /tmp/trig/UNTERM.md

          check() {  # <fixture> <expected exit> <needle or -->
            set +e
            out=$(python tools/check_documented_trigger.py --repo /tmp/trig --doc "$1")
            rc=$?
            set -e
            echo "$out"
            if [ "$rc" -ne "$2" ]; then
              echo "SELF-TEST FAILED: $1 expected exit $2, got $rc"
              exit 1
            fi
            if [ "$3" != "--" ] && ! echo "$out" | grep -q "\"kind\": \"$3\""; then
              echo "SELF-TEST FAILED: $1 did not report failure mode: $3"
              exit 1
            fi
          }

          check BARE.md 1 bare-name
          check MISSING.md 1 trigger-missing
          check OK.md 0 --
          check ALLOWED.md 0 --
          check NOREASON.md 1 allow-without-reason
          check UNTERM.md 1 allow-unterminated
          # A malformed marker opens no region, so the bare names underneath
          # it are still reported. Asserted for BOTH misuse forms: checking
          # only that the misuse fires is a weaker test than the guarantee,
          # and it let a suppression bug through once already.
          check NOREASON.md 1 bare-name
          check UNTERM.md 1 bare-name

          # Invalid input answers with a result, not a traceback.
          printf 'x\n' > /tmp/outside.md
          set +e
          out=$(python tools/check_documented_trigger.py --repo /tmp/trig --doc /tmp/outside.md 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 2 ] || ! echo "$out" | grep -q '"passed": false'; then
            echo "SELF-TEST FAILED: a doc outside --repo must exit 2 with a validator result"
            exit 1
          fi

          # A source climbing out of the repository is not the repository root.
          for bad_source in '../' './..' '..'; do
            printf '{"name":"demo","plugins":[{"name":"demo","source":"%s"}]}\n' "$bad_source" \
              > /tmp/trig/.claude-plugin/marketplace.json
            set +e
            out=$(python tools/check_documented_trigger.py --repo /tmp/trig --doc OK.md 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 2 ]; then
              echo "$out"
              echo "SELF-TEST FAILED: source $bad_source must not count as repo-local"
              exit 1
            fi
            echo "ok: source $bad_source -> exit 2"
          done
          printf '{"name":"demo","plugins":[{"name":"demo","source":"./"}]}\n' \
            > /tmp/trig/.claude-plugin/marketplace.json

          # Every malformed manifest shape answers with a result, not a
          # traceback. Swept rather than patched line by line, because this
          # class of finding had already been fixed in the sibling validator.
          badshape() {  # <label> <marketplace json>
            printf '%s\n' "$2" > /tmp/trig/.claude-plugin/marketplace.json
            set +e
            out=$(python tools/check_documented_trigger.py --repo /tmp/trig --doc OK.md 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 2 ] || ! echo "$out" | grep -q '"passed": false'; then
              echo "$out"
              echo "SELF-TEST FAILED: $1 must exit 2 with a validator result"
              exit 1
            fi
            echo "ok: $1 -> exit 2"
          }
          badshape "manifest is a list"  '["not","an","object"]'
          badshape "plugins is a dict"   '{"name":"d","plugins":{"a":1}}'
          badshape "plugins is a string" '{"name":"d","plugins":"oops"}'
          badshape "plugins is empty"    '{"name":"d","plugins":[]}'
          badshape "entry is a string"   '{"name":"d","plugins":["oops"]}'
          badshape "name is a number"    '{"name":"d","plugins":[{"name":7,"source":"./"}]}'
          printf '{"name":"demo","plugins":[{"name":"demo","source":"./"}]}\n' \
            > /tmp/trig/.claude-plugin/marketplace.json

          # CRLF frontmatter parses: \s* absorbs the carriage return.
          printf -- '---\r\nname: demo\r\ndescription: d\r\n---\r\n\r\nbody\r\n' \
            > /tmp/trig/skills/demo/SKILL.md
          check OK.md 0 --
          printf -- '---\nname: demo\ndescription: d\n---\n\nbody\n' \
            > /tmp/trig/skills/demo/SKILL.md

          echo "self-test OK: every failure mode fires, a signed-off region passes, bad input exits 2"
      - name: Skill frontmatter parses, and stays within the recorded limits
        run: |
          python - <<'PYEOF'
          import pathlib, re, yaml
          # A skill whose frontmatter does not parse is a skill that may simply
          # not load, with no error anyone sees. Claude Code tolerated an
          # unquoted description containing ": " for months; a stricter host
          # would not have, and nothing here would have said so.
          policy = yaml.safe_load(pathlib.Path(
              'control-plane/constitution/policy.yaml').read_text())
          max_lines = policy['placement']['limits']['skill_md_max_lines']
          fails = []
          skills = sorted(pathlib.Path('skills').glob('*/SKILL.md'))
          if not skills:
              print('FAIL: no skills found'); raise SystemExit(1)
          for path in skills:
              text = path.read_text(encoding='utf-8')
              match = re.match(r'^---\s*\n(.*?)\n---\s*\n', text, re.DOTALL)
              if not match:
                  fails.append(f'{path}: no YAML frontmatter'); continue
              try:
                  front = yaml.safe_load(match.group(1))
              except yaml.YAMLError as exc:
                  first = str(exc).splitlines()[0]
                  fails.append(f'{path}: frontmatter is not valid YAML: {first}')
                  continue
              if not isinstance(front, dict):
                  fails.append(f'{path}: frontmatter is not a mapping'); continue
              for key in ('name', 'description'):
                  if not front.get(key):
                      fails.append(f'{path}: frontmatter has no {key}')
              if front.get('name') and front['name'] != path.parent.name:
                  fails.append(f'{path}: name {front["name"]!r} != folder '
                               f'{path.parent.name!r} — the folder is the trigger')
              n = len(text.splitlines())
              if n > max_lines:
                  fails.append(f'{path}: {n} lines exceeds limit {max_lines}')
              else:
                  print(f'{path}: OK ({n} lines, limit {max_lines})')
          for f in fails:
              print('FAIL:', f)
          raise SystemExit(1 if fails else 0)
          PYEOF
      - name: Inventory manifest is reproducible and path-clean (self-test)
        run: |
          set -e
          rm -rf /tmp/inv
          mkdir -p /tmp/inv/src/sub
          printf 'alpha' > /tmp/inv/src/a.txt
          printf 'beta' > /tmp/inv/src/sub/b.txt
          ln -s a.txt /tmp/inv/src/link.txt
          mkdir -p /tmp/inv/outside
          printf 'secret' > /tmp/inv/outside/secret.txt
          ln -s ../outside /tmp/inv/src/escape
          inv=skills/ai-mise/scripts/inventory.py
          python "$inv" --sources /tmp/inv/src --out /tmp/inv/m1.json
          python "$inv" --sources /tmp/inv/src --out /tmp/inv/m2.json
          python - <<'PYEOF'
          import json, pathlib, re
          m1 = json.loads(pathlib.Path('/tmp/inv/m1.json').read_text())
          m2 = json.loads(pathlib.Path('/tmp/inv/m2.json').read_text())
          fails = []
          if m1['content_digest'] != m2['content_digest']:
              fails.append('content_digest differs over an unchanged tree')
          a, b = dict(m1), dict(m2)
          a.pop('run'); b.pop('run')
          if a != b:
              fails.append('manifests differ outside the run block')
          if '/tmp/inv' in json.dumps(m1):
              fails.append('manifest records an absolute source path')
          if not any(s['path'] == 'link.txt' and s['reason'] == 'symlink'
                     for s in m1['skipped']):
              fails.append('symlink was not skipped')
          if 'secret' in json.dumps(m1):
              fails.append('read through a symlinked parent directory')
          if not any(s['path'] == 'escape' and s['reason'] == 'symlink'
                     for s in m1['skipped']):
              fails.append('symlinked directory was not recorded as skipped')
          if m1['file_count'] != 2:
              fails.append('expected 2 files, got %s' % m1['file_count'])
          stable = re.compile(r'^(symlink|not a regular file when opened'
                              r'|changed while being read|unreadable'
                              r'|outside the source folder'
                              r'|[A-Z][A-Z0-9]+)$')
          for s in m1['skipped']:
              if not stable.match(s['reason']):
                  fails.append('skip reason is not a stable token: '
                               + repr(s['reason']))
          for f in fails:
              print('FAIL:', f)
          if not fails:
              print('self-test OK: reproducible, path-clean, symlink-refusing')
          raise SystemExit(1 if fails else 0)
          PYEOF

      - name: Plugin manifests satisfy the stricter sync path (self-test)
        run: |
          set -e
          # This repo must satisfy the rules the account sync enforces, not
          # only the looser ones the CLI applies to a local clone.
          python tools/check_plugin_manifests.py

          # And every failure mode must fire on its own.
          mkfix() {  # <dir> <marketplace json> <plugin json, or - for none>
            rm -rf "$1"; mkdir -p "$1/.claude-plugin" "$1/skills/demo"
            printf '%s\n' "$2" > "$1/.claude-plugin/marketplace.json"
            [ "$3" = "-" ] || printf '%s\n' "$3" > "$1/.claude-plugin/plugin.json"
          }
          expect() {  # <dir> <expected exit> <expected kind, or -- for none>
            set +e
            out=$(python tools/check_plugin_manifests.py --repo "$1")
            rc=$?
            set -e
            if [ "$rc" -ne "$2" ]; then
              echo "$out"
              echo "SELF-TEST FAILED: $1 expected exit $2, got $rc"
              exit 1
            fi
            if [ "$3" != "--" ] && ! echo "$out" | grep -q "\"kind\": \"$3\""; then
              echo "$out"
              echo "SELF-TEST FAILED: $1 did not report failure mode: $3"
              exit 1
            fi
            echo "ok: $1 -> exit $rc ${3}"
          }

          MP='{"name":"demo","plugins":[{"name":"demo","source":"./","version":"1.0.0"}]}'
          GOOD='{"name":"demo","version":"1.0.0"}'

          mkfix /tmp/m_ok   "$MP" "$GOOD"                        ; expect /tmp/m_ok   0 --
          mkfix /tmp/m_miss "$MP" -                              ; expect /tmp/m_miss 1 manifest-missing
          mkfix /tmp/m_name "$MP" '{"name":"WRONG","version":"1.0.0"}'
          expect /tmp/m_name 1 name-mismatch
          mkfix /tmp/m_ver  "$MP" '{"name":"demo","version":"9.9.9"}'
          expect /tmp/m_ver  1 version-mismatch
          mkfix /tmp/m_src  '{"name":"demo","plugins":[{"name":"demo","source":"nope/"}]}' '{"name":"demo"}'
          expect /tmp/m_src  1 bad-relative-source
          mkfix /tmp/m_bin  "$MP" "$GOOD" ; mkdir -p /tmp/m_bin/bin
          expect /tmp/m_bin  1 reserved-bin
          mkfix /tmp/m_skl  "$MP" "$GOOD" ; rm -rf /tmp/m_skl/skills
          expect /tmp/m_skl  1 skills-missing
          # "./.." starts with "./" and is not the repo root — it climbs out.
          mkfix /tmp/m_esc  '{"name":"demo","plugins":[{"name":"demo","source":"./.."}]}' "$GOOD"
          expect /tmp/m_esc  1 source-escapes-repo
          # …but "..foo" is an ordinary directory rather than a climb, and a
          # string-prefix test cannot tell the two apart.
          mkfix /tmp/m_dots '{"name":"demo","plugins":[{"name":"demo","source":"./..foo","version":"1.0.0"}]}' "$GOOD"
          expect /tmp/m_dots 0 --

          # Malformed manifests answer with a result and exit 2, not a traceback.
          bad() {  # <label> <marketplace json> <plugin json>
            mkfix /tmp/m_bad "$2" "$3"
            set +e
            out=$(python tools/check_plugin_manifests.py --repo /tmp/m_bad 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 2 ] || ! echo "$out" | grep -q '"passed": false'; then
              echo "$out"
              echo "SELF-TEST FAILED: $1 must exit 2 with a validator result"
              exit 1
            fi
            echo "ok: $1 -> exit 2"
          }
          bad "plugins is not a list"        '{"name":"demo","plugins":{"a":1}}' "$GOOD"
          bad "plugins is empty"             '{"name":"demo","plugins":[]}' "$GOOD"
          bad "a plugin entry is not object" '{"name":"demo","plugins":["oops"]}' "$GOOD"
          bad "plugin.json is not an object" "$MP" '["not","an","object"]'
          # An entry with no usable source must not be waved through as "remote".
          bad "entry has no source"   '{"name":"demo","plugins":[{"name":"demo"}]}' "$GOOD"
          bad "entry source is null"  '{"name":"demo","plugins":[{"name":"demo","source":null}]}' "$GOOD"
          bad "entry has no name"     '{"name":"demo","plugins":[{"source":"./"}]}' "$GOOD"

          # A genuinely remote plugin still passes: its manifest is not ours.
          mkfix /tmp/m_rem '{"name":"demo","plugins":[{"name":"x","source":{"source":"github","repo":"a/b"}}]}' "$GOOD"
          expect /tmp/m_rem 0 --

          echo "self-test OK: every failure mode fires, clean layout passes, malformed input exits 2"
